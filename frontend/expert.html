<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>专家工作量评估</title>
<style>
  :root{
    --bg:#f5f6f8; --card:#fff; --line:#e5e7eb; --text:#1f2430; --muted:#6b7280;
    --brand:#2563eb; --brand-d:#1d4ed8; --ok:#15803d; --warn:#b45309; --danger:#c0281f;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--text);
    font:14px/1.6 -apple-system,BlinkMacSystemFont,"Segoe UI","Microsoft YaHei",sans-serif}
  .wrap{max-width:1240px;margin:0 auto;padding:8px 10px 0}
  .top{background:#fff;border:1px solid var(--line);border-radius:10px;padding:8px 12px;margin-bottom:6px}
  .top h1{margin:0 0 2px;font-size:15px;font-weight:600}
  /* 项目名最多两行，避免超长名称把首屏吃掉 */
  .ptitle{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;line-height:1.35}
  .meta{color:var(--muted);font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:5px}
  .chip{background:#f3f4f6;border-radius:999px;padding:2px 9px;font-size:12px;color:#374151;white-space:nowrap}
  .chip b{font-weight:600}
  .chip.todo{background:#fef3c7;color:#92400e}
  .chip.done{background:#dcfce7;color:#166534}
  .card{background:#fff;border:1px solid var(--line);border-radius:8px;padding:7px 10px;margin-bottom:5px}
  .prow{display:flex;align-items:center;justify-content:space-between;gap:9px;cursor:pointer}
  .prow:hover .pname{color:var(--brand)}
  .idx{flex:none;width:26px;height:24px;border-radius:6px;background:#eef2f7;color:#64748b;
    font-size:12px;font-weight:600;display:flex;align-items:center;justify-content:center;
    font-variant-numeric:tabular-nums}
  .pbody{flex:1;min-width:0}
  .pname{font-size:13.5px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .pmeta{color:var(--muted);font-size:11.5px;margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .badge{flex:none;font-size:11.5px;padding:2px 8px;border-radius:999px;white-space:nowrap}
  .b-todo{background:#fef3c7;color:#92400e}
  .b-done{background:#dcfce7;color:#166534}
  .b-none{background:#f3f4f6;color:#6b7280}
  .b-lock{background:#fee2e2;color:#991b1b}
  .back{display:inline-flex;align-items:center;gap:5px;background:none;border:none;color:var(--brand);
    cursor:pointer;font-size:13px;padding:2px 0;margin-bottom:4px}
  /* 固定布局 + 单行省略：任何长文本都不撑高行，一屏能多看几行（悬浮看全文） */
  table{width:100%;min-width:880px;border-collapse:collapse;font-size:12.5px;table-layout:fixed}
  th,td{border-bottom:1px solid var(--line);padding:4px 6px;text-align:left;vertical-align:middle;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  th{background:#f9fafb;font-weight:600;color:#374151;position:sticky;top:0;z-index:2;font-size:12px}
  td.num,th.num{text-align:right}
  .cat{font-size:13px;font-weight:600;margin:9px 0 4px}
  .cat:first-child{margin-top:2px}
  input[type=number]{width:100%;max-width:112px;padding:3px 14px 3px 6px;border:1px solid #d1d5db;
    border-radius:6px;font-size:12.5px;text-align:right;font-variant-numeric:tabular-nums}
  input[type=number]:focus{outline:none;border-color:var(--brand);box-shadow:0 0 0 2px rgba(37,99,235,.15)}
  .saved{color:var(--ok);font-size:11.5px;white-space:nowrap}
  .bar{position:sticky;bottom:0;background:rgba(255,255,255,.97);border-top:1px solid var(--line);
    padding:6px 10px;display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;
    margin:6px -10px 0}
  button.primary{background:var(--brand);color:#fff;border:none;border-radius:7px;padding:7px 16px;font-size:13px;cursor:pointer}
  button.primary:hover{background:var(--brand-d)}
  button.primary:disabled{background:#9ca3af;cursor:not-allowed}
  button.ghost{background:#fff;border:1px solid #d1d5db;border-radius:7px;padding:6px 12px;cursor:pointer;font-size:12.5px}
  .toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%);background:#111827;color:#fff;
    padding:10px 18px;border-radius:8px;font-size:13px;z-index:99;opacity:0;transition:opacity .2s;pointer-events:none}
  .toast.show{opacity:1}
  .center{text-align:center;padding:40px 16px;color:var(--muted)}
  .err{max-width:520px;margin:60px auto;background:#fff;border:1px solid var(--line);border-radius:12px;padding:28px;text-align:center}
  .err h2{margin:0 0 8px;font-size:16px;color:var(--danger)}
  .hint{color:var(--muted);font-size:12px;margin-top:4px}
  .tbl-wrap{overflow:auto;border:1px solid var(--line);border-radius:8px;background:#fff;
    max-height:calc(100vh - 176px);min-height:240px}
  /* 评估人天：默认预填原人天，用上下箭头按所选步长增减 */
  input[type=number].adj{border-color:var(--warn);background:#fffbeb;color:var(--warn);font-weight:600}
  .stepbar{display:flex;align-items:center;gap:5px;flex-wrap:wrap}
  .stepbar .lbl{color:var(--muted);font-size:12px}
  .stepbtn{background:#fff;border:1px solid #d1d5db;border-radius:6px;padding:3px 11px;font-size:12.5px;
    cursor:pointer;color:#374151;font-variant-numeric:tabular-nums}
  .stepbtn:hover{border-color:var(--brand);color:var(--brand)}
  .stepbtn.on{background:var(--brand);border-color:var(--brand);color:#fff}
  .statuscell{font-size:11.5px}
  .pending{color:#9ca3af}
  .adjnote{color:var(--warn)}
</style>
</head>
<body>
<div id="app"><div class="center">正在加载…</div></div>
<div class="toast" id="toast"></div>
<script>
// 短链形如 /e/<code>（地址栏与接口里都不出现长令牌）；同时兼容早期已发出的 /expert.html?k=<token>
// 短码入口：同域 /e/<code>，或独立短域下的根路径 /<code>（如 e.mjumju.com/kf7mQ2）
const PATHCODE=(location.pathname.match(/^\/e\/([A-Za-z0-9_-]{4,80})/)||[])[1]
  ||(location.pathname.match(/^\/([A-Za-z0-9_-]{4,80})\/?$/)||[])[1]||'';
const TOKEN=new URLSearchParams(location.search).get('k')||'';
const API=PATHCODE?('/api/e/'+encodeURIComponent(PATHCODE)):('/api/expert-invite/'+encodeURIComponent(TOKEN));
let STATE=null, CUR=null;
const $=id=>document.getElementById(id);
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function money(n){return '¥'+Number(n||0).toLocaleString();}
function toast(msg){const t=$('toast');t.textContent=msg;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),2200);}
async function api(path,opts){
  const r=await fetch(path,opts);
  let d={};try{d=await r.json();}catch(_){}
  if(!r.ok) throw new Error(d.error||('请求失败（HTTP '+r.status+'）'));
  return d;
}
const CAT={outsourcing:'人员外包',subcontract:'专业分包'};

// ---------- 评估人天步长（与登录版口径一致：0.5 / 1 / 3 / 5）----------
let estimateStep=0.5;
function setEstimateStep(val,btn){
  estimateStep=val;
  document.querySelectorAll('input[data-wid]').forEach(inp=>inp.step=val);
  document.querySelectorAll('.stepbtn').forEach(b=>b.classList.remove('on'));
  if(btn)btn.classList.add('on');
}
// 与「原人天」不同的行做高亮，方便专家一眼看出自己改过哪些
function paintAdjust(inp){
  const cur=inp.value===''?null:parseFloat(inp.value);
  const pd=inp.dataset.pd===''?null:parseFloat(inp.dataset.pd);
  const changed=cur!=null&&pd!=null&&Math.abs(cur-pd)>1e-9;
  inp.classList.toggle('adj',changed);
}
function bindAdjustMarks(){
  document.querySelectorAll('input[data-wid]').forEach(inp=>{
    if(inp.dataset.bound)return;
    inp.dataset.bound='1';
    inp.addEventListener('input',()=>paintAdjust(inp));
    inp.addEventListener('change',()=>paintAdjust(inp));
    paintAdjust(inp);
  });
}

function renderError(msg){
  $('app').innerHTML='<div class="err"><h2>无法打开评估页</h2><div>'+esc(msg)+'</div>'
    +'<div class="hint">如需帮助，请联系经济评审管理员重新生成评估链接。</div></div>';
}

function renderList(){
  const s=STATE;
  const today=new Date();
  const left=Math.max(0,Math.ceil((new Date(s.expires_at)-today)/86400000));
  let h='<div class="wrap"><div class="top">'
    +'<h1>专家工作量评估</h1>'
    +'<div class="meta" title="'+esc(s.expert_name)+' · '+esc(s.role_label)+' · '+esc(s.session.name)+'">'
      +esc(s.expert_name)+' · '+esc(s.role_label)+' · '+esc(s.session.name)
      +(s.session.review_time?(' · 评审时间 '+esc(s.session.review_time)):'')+'</div>'
    +'<div class="chips">'
      +'<span class="chip">共 <b>'+s.stats.total+'</b> 个项目</span>'
      +'<span class="chip todo">待评估 <b>'+s.stats.todo+'</b> 个</span>'
      +'<span class="chip done">已提交 <b>'+s.stats.done+'</b> 个</span>'
      +'<span class="chip">有效期剩余 <b>'+left+'</b> 天</span>'
    +'</div>'
    +'<div class="hint">请只填写您本人的评估值。系统仅展示您自己提交的人天，不含其他专家数据。</div>'
  +'</div>';
  if(!s.projects.length){
    h+='<div class="card center">本批次暂无可评估的项目。</div>';
  }
  s.projects.forEach((p,i)=>{
    const cls=p.submitted?'b-done':(p.locked?'b-lock':(p.needs_estimate?'b-todo':'b-none'));
    const txt=p.submitted?'已提交':(p.locked?'已归档，不可修改':(p.needs_estimate?('待评估 · '+p.done_count+'/'+p.item_count):'无需评估'));
    const meta=[p.project_code||'—',p.biz_department||'—',p.project_type||'—'].join(' · ');
    h+='<div class="card"><div class="prow" onclick="openProject('+p.id+')">'
      +'<div class="idx">'+(i+1)+'</div>'
      +'<div class="pbody">'
        +'<div class="pname" title="'+esc(p.project_name)+'">'+esc(p.project_name)+'</div>'
        +'<div class="pmeta" title="'+esc(meta)+'">'+esc(meta)+'</div>'
      +'</div>'
      +'<span class="badge '+cls+'">'+esc(txt)+'</span></div></div>';
  });
  h+='</div>';
  $('app').innerHTML=h;
}

async function openProject(pid){
  $('app').innerHTML='<div class="center">正在加载项目明细…</div>';
  try{
    const d=await api(API+'/projects/'+pid);
    CUR=d; renderProject();
  }catch(e){ renderError(e.message); }
}

function renderProject(){
  const d=CUR, p=d.project;
  const seq=(STATE&&STATE.projects)?(STATE.projects.findIndex(x=>x.id===p.id)+1):0;
  const seqTxt=seq>0?('第 '+seq+' / '+STATE.projects.length+' 个项目'):'';
  let h='<div class="wrap"><button class="back" onclick="backToList()">← 返回项目列表</button>'
    +'<div class="top"><h1 class="ptitle" title="'+esc(p.project_name)+'">'+esc(p.project_name)+'</h1>'
    +'<div class="meta" title="'+esc(p.project_code||'—')+' · '+esc(p.biz_department||'—')+'">'
      +(seqTxt?seqTxt+' · ':'')+esc(p.project_code||'—')+' · '+esc(p.biz_department||'—')
      +' · 「我的评估人天」默认取原人天，用箭头按步长微调</div>'
    +'<div class="chips"><span class="badge '+(p.submitted?'b-done':(p.locked?'b-lock':'b-todo'))+'">'
      +(p.submitted?'已全部提交':(p.locked?'已归档，不可修改':('待评估 '+p.done_count+'/'+p.item_count)))
      +'</span></div></div>';
  if(!d.items.length){
    h+='<div class="card center">该项目的成本明细中没有「人员外包 / 专业分包」条目，无需专家评估。</div></div>';
    $('app').innerHTML=h; return;
  }
  d.categories.forEach(c=>{
    const items=d.items.filter(x=>x.category===c.key);
    if(!items.length) return;
    // 固定列宽 + 单行省略：长文本不再撑高行高，一屏能多显示近一倍行数（悬浮单元格可看全文）
    h+='<div class="cat">'+esc(c.label)+'（'+items.length+' 项）</div>'
      +'<div class="tbl-wrap"><table><colgroup>'
      +'<col style="width:84px"><col style="width:150px"><col style="width:208px"><col style="width:68px">'
      +'<col style="width:58px"><col style="width:84px"><col style="width:118px"><col style="width:110px">'
      +'</colgroup><thead><tr>'
      +'<th>任务</th><th>工作项</th><th>说明</th><th>人员</th><th class="num">原人天</th><th class="num">原费用</th>'
      +'<th class="num">我的评估人天</th><th>状态</th>'
      +'</tr></thead><tbody>';
    items.forEach(w=>{
      const pd=w.person_days!=null?w.person_days:null;
      const cur=w.my_days!=null?w.my_days:(pd!=null?pd:'');
      const adjusted=(w.my_days!=null&&pd!=null&&w.my_days!==pd);
      h+='<tr>'
        +'<td title="'+esc(w.work_task||'')+'">'+esc(w.work_task||'—')+'</td>'
        +'<td title="'+esc(w.work_item||'')+'">'+esc(w.work_item||'—')+'</td>'
        +'<td title="'+esc(w.description||'')+'">'+esc(w.description||'—')+'</td>'
        +'<td title="'+esc(w.person||'')+'">'+esc(w.person||'—')+'</td>'
        +'<td class="num">'+(pd!=null?pd:'—')+'</td>'
        +'<td class="num" style="color:#6b7280">'+money(w.cost)+'</td>'
        +'<td class="num"><input type="number" min="0" step="'+estimateStep+'" data-wid="'+w.id+'" '
          +'data-pd="'+(pd!=null?pd:'')+'" '
          +(p.locked?'disabled ':'')+'value="'+cur+'" '
          +'placeholder="'+(pd!=null?pd:'?')+'"></td>'
        +'<td class="statuscell">'+(w.my_days!=null
            ?('<span class="saved">已提交 '+w.my_days+'</span>'+(adjusted?(' <span class="adjnote">原'+pd+'</span>'):''))
            :'<span class="pending">未提交</span>')+'</td>'
        +'</tr>';
    });
    h+='</tbody></table></div>';
  });
  const anySubmitted=d.items.some(x=>x.my_days!=null);
  h+='<div class="bar"><div class="stepbar">'
    +'<span class="lbl">步长</span>'
    +[0.5,1,3,5].map(v=>'<button type="button" class="stepbtn'+(estimateStep===v?' on':'')
        +'" onclick="setEstimateStep('+v+',this)">'+v+'</button>').join('')
    +'<span class="lbl">上下箭头微调 · 黄框=已改动 · 本表 '+d.items.length+' 项</span>'
    +'</div>'
    +'<button class="primary" id="submitBtn" data-label="'+(anySubmitted?'更新我的评估':'提交我的评估')+'"'
    +(p.locked?' disabled':'')+' onclick="submitAll('+p.id+')">'
    +(p.locked?'已归档，不可提交':(anySubmitted?'更新我的评估':'提交我的评估'))+'</button></div></div>';
  $('app').innerHTML=h;
  bindAdjustMarks();
}

function backToList(){ CUR=null; history.replaceState(null,'',PATHCODE?location.pathname:('?k='+encodeURIComponent(TOKEN))); load(); }

async function submitAll(pid){
  const inputs=[...document.querySelectorAll('input[data-wid]')];
  const items=[],bad=[];
  inputs.forEach(i=>{
    if(i.value==='') return;
    const days=parseFloat(i.value);
    if(!isFinite(days)||days<=0){ bad.push(i); return; }
    items.push({work_item_id:parseInt(i.dataset.wid),days});
  });
  if(bad.length){ toast('有 '+bad.length+' 项人天不是大于 0 的数字，请修正后再提交'); bad[0].focus(); return; }
  if(!items.length){ toast('请先填写要评估的人天数'); return; }
  const btn=$('submitBtn'), label=btn.dataset.label||'提交我的评估';
  btn.disabled=true; btn.textContent='提交中…';
  try{
    const r=await api(API+'/estimates',{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({project_id:pid,items})});
    toast('已提交 '+r.saved+' 项评估'+(r.skipped&&r.skipped.length?('，'+r.skipped.length+' 项被跳过'):''));
    await openProject(pid);
    if(STATE){ // 同步列表状态
      const p=STATE.projects.find(x=>x.id===pid);
      if(p){ p.done_count=(r.items||[]).length; }
    }
  }catch(e){
    toast(e.message);
    btn.disabled=false; btn.textContent=label;
  }
}

async function load(){
  if(!TOKEN&&!PATHCODE){ renderError('链接缺少访问令牌，请使用管理员发给您的完整链接打开'); return; }
  try{
    STATE=await api(API);
    renderList();
  }catch(e){ renderError(e.message); }
}
load();
</script>
</body>
</html>
