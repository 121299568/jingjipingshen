version: '3.8'

# 本地一体化开发/演示编排（非生产）。
# 当前默认 DB_DRIVER=json，无需 MySQL/Redis 即可完整跑通。
# 接入正式 MySQL 时：把 DB_DRIVER 改为 mysql，并启用下方被注释的 mysql 服务段。

services:
  # 后端 API（与 Render 同一份镜像，本地用 json 文件存储）
  api:
    build: ./backend
    # 仅本地调试时对外暴露；日常通过 web(nginx) 同源代理访问，可不暴露
    ports:
      - "4000:3000"
    environment:
      - NODE_ENV=development
      - PORT=3000
      - DB_DRIVER=json
      - JWT_SECRET=local-dev-secret-change-me
      - CORS_ORIGINS=http://localhost:3000
    volumes:
      - ./backend:/app
      - /app/node_modules
    networks:
      - app-network

  # 前端静态站点 + /api 反向代理（同源，浏览器免 CORS）
  web:
    image: nginx:alpine
    ports:
      - "3000:80"
    volumes:
      - ./frontend:/usr/share/nginx/html:ro
      - ./docker/nginx.frontend.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - api
    networks:
      - app-network

  # ===== 接入 MySQL 时启用（DB_DRIVER=mysql）=====
  # mysql:
  #   image: mysql:8.0
  #   ports:
  #     - "3306:3306"
  #   environment:
  #     - MYSQL_ROOT_PASSWORD=RootPass123!
  #     - MYSQL_DATABASE=economic_review
  #     - MYSQL_USER=review_user
  #     - MYSQL_PASSWORD=ReviewPass123!
  #   volumes:
  #     - mysql_data:/var/lib/mysql
  #     - ./backend/db.sql:/docker-entrypoint-initdb.d/init.sql
  #   healthcheck:
  #     test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-pRootPass123!"]
  #     interval: 10s
  #     timeout: 5s
  #     retries: 5
  #   networks:
  #     - app-network

# volumes:
#   mysql_data:
#     driver: local

networks:
  app-network:
    driver: bridge
